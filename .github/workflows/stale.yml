name: Stale

on:
  schedule:
    # 每日 UTC 01:30 运行
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: 'good first issue,help wanted,security'
          exempt-pr-labels: 'good first issue,help wanted,security'
          stale-issue-message: >-
            该 Issue 已超过 60 天没有新的活动，被标记为待归档。
            如果问题仍然存在，请直接回复补充信息即可重新打开；
            若 14 天内仍无回应，将被自动关闭。
          stale-pr-message: >-
            该 PR 已超过 60 天没有新的活动，被标记为待归档。
            如需继续推进，请回复或推送新的提交即可移除该标记；
            若 14 天内仍无回应，将被自动关闭。
          close-issue-message: >-
            由于长期无回应，该 Issue 已被自动关闭。
            如问题仍可复现，欢迎回复说明或直接重新打开。
          close-pr-message: >-
            由于长期无回应，该 PR 已被自动关闭。
            如需继续，欢迎重新打开或另开新的 PR。
